artifact_families:
  contract_artifact:
    exact_names:
      - action_requests.json
      - artifact_summary.md
    suffixes:
      - _contract.md
      - _schema.json
      - _rules.yaml
      - _rules.yml
      - _checklist.md
      - _checklist.csv
      - _report.md
      - _review.md
      - _analysis.md
      - _notes.md
      - _decision.md
      - _decision.json
      - _decision_table.csv
      - _evidence_table.csv
      - _gap_table.csv
      - _comparison_table.csv
      - _failure_table.csv
      - _matrix.csv
      - _recommendation.md
    markers:
      - artifact_checklist
      - evidence_contract
      - evidence_decision_table
      - evidence_table
      - expected_metrics_schema
      - judge_rules
      - required_outputs_checklist
      - decision_report
      - decision_table
      - decision
      - evidence_review
      - evidence_analysis
      - gap_table
      - comparison_table
      - failure_table
      - artifact_matrix
      - recommendation
      - next_action

closure_contract:
  default_required_files:
    - worker_notes.md
    - artifact_summary.md
    - action_requests.json
  applies_to:
    - materialized_execution
  disable_with:
    enabled: false

scripts:
  solution_agent_smoke_write_metrics:
    entrypoint: [python, -m, solution_agent.execution_port.smoke_script]
    args:
      output_dir:
        flag: --output_dir
        type: path
        required: true
      message:
        flag: --message
        type: str
        required: false
      sleep_seconds:
        flag: --sleep_seconds
        type: float
        required: false
    max_timeout_sec: 60
    gpu_allowed: false

  run_probe_smoke:
    entrypoint: [python, .codex-orchestrator/runtime/scripts/probes/run_probe.py]
    entrypoint_must_exist: true
    args:
      config:
        flag: --config
        type: path
        required: true
      output_dir:
        flag: --output_dir
        type: path
        required: true
      smoke:
        flag: --smoke
        type: bool
        default: false
    max_timeout_sec: 300
    gpu_allowed: false

  run_eval_probe:
    entrypoint: [python, .codex-orchestrator/runtime/scripts/probes/run_eval_probe.py]
    entrypoint_must_exist: true
    args:
      config:
        flag: --config
        type: path
        required: true
      output_dir:
        flag: --output_dir
        type: path
        required: true
      smoke:
        flag: --smoke
        type: bool
        default: false
    max_timeout_sec: 7200
    gpu_allowed: true

  run_recipe_ablation:
    entrypoint: [python, .codex-orchestrator/runtime/scripts/eval/run_recipe_ablation.py]
    entrypoint_must_exist: true
    args:
      config:
        flag: --config
        type: path
        required: true
      output_dir:
        flag: --output_dir
        type: path
        required: true
      variant:
        flag: --variant
        type: str
