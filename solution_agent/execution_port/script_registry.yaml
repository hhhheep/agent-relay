      - prefix: base_candidate.
      - prefix: md_sync_metrics.
      - suffix: .md.writer.json
      - suffix: report_writer_metrics.json
      - suffix: publication_packet.json
      - suffix: report_writer_failure.json

  fsfm_s0_acquire:
    description: Acquire the pinned original FSFM source and optionally exactly three VF2 ViT-B 400e assets with create-only SHA verification.
    entrypoint: [python, scripts/harness/run_fsfm_s0_acquire.py]
    entrypoint_must_exist: true
    args:
      checkout_dir:
        flag: --checkout_dir
        type: path
        path_role: output
        required: true
      weights_dir:
        flag: --weights_dir
        type: path
        path_role: output
        required: true
      output_dir:
        flag: --output_dir
        type: path
        path_role: output
        required: true
      source_only:
        flag: --source_only
        type: bool
        default: false
    max_timeout_sec: 3600
    gpu_allowed: false
    access_contract:
      permitted_sources:
        - https://github.com/wolo-wolo/FSFM-CVPR25.git
        - https://huggingface.co/Wolowolo/fsfm-3c/resolve/main/pretrained_models/VF2_ViT-B/
      downloads_only_pinned_assets: true
      verifies_sha256: true
      source_only_supported: true
      checkpoint_unpickled: false
      modifies_raw_data: false
    expected_metrics:
      file: fsfm_s0_acquire_metrics.json
      required_keys:
        - execution_status
        - contract_status
        - science_status
        - source_checkout_present
        - source_only
        - asset_count_expected
        - asset_count_verified
        - elapsed_seconds
        - gpu_used
        - checkpoint_unpickled
      numeric_keys:
        - asset_count_expected
        - asset_count_verified
        - elapsed_seconds
      finite_required: true
    produces_artifact_families:
      - prefix: fsfm_s0_acquire

  fsfm_s0_inventory:
    description: Bounded metadata-only FAN FSFM source and dataset inventory.
    entrypoint: [python, scripts/harness/run_fsfm_s0_inventory.py]
    entrypoint_must_exist: true
    args:
      ffpp_root:
        flag: --ffpp_root
        type: path
        path_role: input
        required: true
        must_exist: true
      dfdc_root:
        flag: --dfdc_root
        type: path
        path_role: input
        required: true
        must_exist: true
      celeb_df_v2_root:
        flag: --celeb_df_v2_root
        type: path
        path_role: input
        required: true
        must_exist: true
      repo_root:
        flag: --repo_root
        type: path
        path_role: input
        required: true
        must_exist: true
      output_dir:
        flag: --output_dir
        type: path
        path_role: output
        required: true
    max_timeout_sec: 300
    gpu_allowed: false
    access_contract:
      reads_image_headers: false
      reads_image_pixels: false
      recursive_dataset_scan: false
      bounded_workspace_inventory: true
      modifies_raw_data: false
      copies_raw_data: false
    expected_metrics:
      file: fsfm_s0_inventory_metrics.json
      required_keys:
        - execution_status
        - contract_status
        - science_status
        - dataset_roots_observed
        - dataset_roots_missing
        - upstream_checkout_present
        - image_pixels_read
        - write_enabled
      numeric_keys:
        - dataset_roots_observed
        - dataset_roots_missing
      finite_required: true
    produces_artifact_families:
      - prefix: fsfm_s0_inventory.

  fsfm_s0_boundary:
    description: >-
      CPU-only, read-only audit of the pinned FSFM checkout and bounded official
      publisher metadata; it never reads target datasets or checkpoint tensors.
    entrypoint: [python, scripts/harness/run_fsfm_s0_boundary.py]
    entrypoint_must_exist: true
    args:
      repo_root:
        flag: --repo_root
        type: path
        path_role: input
        required: true
        must_exist: true
      output_dir:
        flag: --output_dir
        type: path
        path_role: output
        required: true
    max_timeout_sec: 2700
    gpu_allowed: false
    access_contract:
      official_sources_only: true
      permitted_sources:
        - https://github.com/wolo-wolo/FSFM-CVPR25
        - https://openaccess.thecvf.com/content/CVPR2025/html/Wang_FSFM_A_Generalizable_Face_Security_Foundation_Model_via_Self-Supervised_Facial_CVPR_2025_paper.html
        - https://huggingface.co/Wolowolo/fsfm-3c/raw/main/finetuned_models/FF%2B%2B_c23_32frames/
      max_single_remote_bytes: 2097152
      checkpoint_body_downloaded: false
      checkpoint_unpickled: false
      reads_target_results: false
      reads_dataset_headers: false
      reads_dataset_pixels: false
      launches_training: false
      writes_researchflow: false
      modifies_source_checkout: false
    expected_metrics:
      file: fsfm_s0_boundary_metrics.json
      required_keys:
        - execution_status
        - contract_status
        - science_status
        - source_commit_verified
        - official_metadata_verified
        - checkpoint_body_downloaded
        - checkpoint_unpickled
        - gpu_used
        - target_results_read
        - researchflow_write_enabled
      finite_required: true
    produces_artifact_families:
      - prefix: fsfm_s0_boundary
      - prefix: claim_evidence_boundary
      - prefix: checkpoint_provenance
      - prefix: d1_direct_eval_spec
      - prefix: s0_data_handoff
      - prefix: action_requests
      - prefix: worker_notes
      - prefix: artifact_summary
