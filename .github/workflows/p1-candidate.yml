name: P1 candidate checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["codex/phase-one-restructure", "codex/hf*", "codex/worker-session-binding-*"]
permissions:
  contents: read
jobs:
  windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolated Python dependencies
        run: python scripts/release/install_dependencies.py --role windows-client --python-only
      - name: Candidate privacy and immutable extraction provenance
        run: |
          .venv/Scripts/python.exe scripts/extraction/check-publication.py
          .venv/Scripts/python.exe scripts/release/provenance.py
      - name: Core and synthetic update regression
        run: .venv/Scripts/python.exe -m pytest tests/test_harness_connection_admission.py tests/test_harness_managed_launch.py tests/test_profile_deploy.py tests/test_build_profile_plugin.py tests/test_terminal_commands.py tests/test_harness_protocol_06.py tests/test_harness_release_identity.py tests/test_harness_artifact_apply.py tests/test_managed_publication.py tests/test_harness_report_writer.py tests/test_harness_task_capsule.py tests/test_work_unit_review.py tests/test_harness_bootstrap_release.py tests/test_harness_remote_profile.py tests/test_harness_codex_worker.py tests/test_worker_session_identity.py tests/test_worker_session_pool.py tests/test_worker_session_cli.py tests/test_harness_four_fixes.py tests/test_worker_job_reattach.py tests/test_remote_terminal.py tests/test_terminal_lease_errors.py tests/test_terminal_owner_diagnostics.py tests/test_routing_submission_recovery.py tests/test_publication_registry.py tests/test_md_sync.py tests/test_harness_md_sync.py tests/test_harness_event_wait.py tests/test_fsfm_s0_inventory.py tests/test_fsfm_s0_boundary.py tests/test_fsfm_s0_acquire.py tests/test_skill_routing_contract.py tests/test_harness_mcp.py tests/test_remote_preflight.py tests/test_p1_installation.py -q
      - name: Shared Provider frozen dependencies
        # Legacy suites use explicit synthetic workspace inputs; no private policies.
        run: npm ci --prefix packages/report-provider --ignore-scripts --no-audit --no-fund
      - name: Legacy synthetic workspace regression
        run: .venv/Scripts/python.exe -m pytest tests/test_remote_status_worker_agnostic.py tests/test_continuation_three_agent_flow.py tests/test_workflow_profile.py tests/test_linux_namespace_acceptance.py -q
      - name: Token Guard receipt and ledger regression
        run: .venv/Scripts/python.exe -m pytest plugins/research-token-guard/tests -q
      - name: Writer frozen dependencies
        run: |
          npx --yes pnpm@11.25.0 --dir plugins/research-report-writer install --frozen-lockfile --ignore-scripts
      - name: Consumer tests (mock HTTP, no paid API)
        run: node --test packages/report-provider/tests/*.test.mjs plugins/research-report-writer/tests/*.test.mjs tools/research-background/tests.mjs
      - name: Frozen lifecycle build toolchain
        run: |
          npm ci --prefix components/lifecycle --ignore-scripts --no-audit --no-fund
          npm ci --prefix components/goal-routing-integration --ignore-scripts --no-audit --no-fund
      - name: Target-native XATS dependencies and smoke build
        run: |
          npx --yes pnpm@11.25.0 --dir components/xats-routing-lab/upstream install --frozen-lockfile --ignore-scripts
          npm rebuild --prefix components/xats-routing-lab/upstream better-sqlite3
          node scripts/extraction/build-local.mjs
      - name: Lifecycle and goal integration
        working-directory: components/lifecycle
        run: |
          $env:PYTHONPATH = (Resolve-Path ../..).Path
          npm test
          node --import tsx --test ../goal-routing-integration/app-receipt.test.ts ../goal-routing-integration/native-dispatch.test.ts
          npm run build
      - name: Source-only candidate build
        run: |
          .venv/Scripts/python.exe scripts/release/build_candidate.py
          node scripts/release/check_writer_plugin.mjs
  linux-worker-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Isolated Linux worker dependencies
        run: python scripts/release/install_dependencies.py --role linux-worker --python-only
      - name: Worker identity, original command and ownership regression
        run: .venv/bin/python -m pytest tests/test_worker_session_identity.py tests/test_worker_session_pool.py tests/test_worker_session_cli.py tests/test_harness_remote_profile.py tests/test_harness_codex_worker.py tests/test_worker_job_reattach.py tests/test_terminal_commands.py tests/test_harness_task_capsule.py tests/test_help_resume.py tests/test_harness_mcp.py::test_containment_canonicalizes_declared_root_alias_without_accepting_foreign_path -q -ra
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frozen Lifecycle dependencies
        run: npm ci --prefix components/lifecycle --ignore-scripts --no-audit --no-fund
      - name: PreCompact identity and original controller handoff
        working-directory: components/lifecycle
        run: node --import tsx --test context-rollover.test.ts controller-authority.test.ts native-app-port.test.ts session-lifecycle.test.ts
# Windows candidate and bounded Linux worker validation; this is not a live
# installation, real Desktop rollover or complete M1-M4 acceptance.
