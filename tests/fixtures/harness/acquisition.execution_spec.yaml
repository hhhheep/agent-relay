task_id: synthetic_acquisition
job_type: bounded_acquisition
workspace:
  root: /synthetic/workplace
  cwd: /synthetic/workplace
command:
  script_id: fsfm_s0_acquire
  args:
    checkout_dir: /synthetic/workplace/external/FSFM-CVPR25
    weights_dir: assets/weights
    output_dir: artifacts/{job_id}
    source_only: false
  timeout_sec: 3600
resources:
  gpu_required: false
  gpu_count: 0
artifacts:
  required:
    - artifacts/{job_id}/fsfm_s0_acquire.json
    - artifacts/{job_id}/fsfm_s0_acquire_metrics.json
success_criteria:
  exit_code: 0
  metrics_file: artifacts/{job_id}/fsfm_s0_acquire_metrics.json
  metric_keys: [execution_status, contract_status, science_status]
